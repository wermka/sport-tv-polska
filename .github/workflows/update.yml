
name: Aktualizacja Sport TV Polska

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Zainstaluj Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sprawdz Live Tennis API
        env:
          LIVE_TENNIS_API_KEY: ${{ secrets.LIVE_TENNIS_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request

          key = os.environ["LIVE_TENNIS_API_KEY"]
          url = "https://api.livetennisapi.com/api/public/v1/matches?status=upcoming&country=pol&limit=50"

          req = urllib.request.Request(
              url,
              headers={"X-API-Key": key}
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              data = json.load(response)

          print("Polaczenie z Live Tennis API: OK")
          print("Liczba pobranych meczow:", len(data.get("data", [])))
          
          matches = data.get("data", [])
          if matches:
              print("Pola dostepne w meczu:")
              print(list(matches[0].keys()))
              print("Przykladowy mecz:")
              safe_fields = {
                  k: v for k, v in matches[0].items()
                  if k in ("id", "date", "start_time", "status", "home", "away", "player1", "player2", "players", "tournament")
              }
              print(json.dumps(safe_fields, ensure_ascii=False, default=str)[:2000])

          PY

      - name: Aktualizuj terminarz
        run: python update_epg.py https://epgshare01.online/epgshare01/epg_ripper_PL1.xml.gz

      - name: Zapisz zmiany
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json
          if ! git diff --cached --quiet; then
            git commit -m "Automatyczna aktualizacja terminarza"
            git push
          fi
