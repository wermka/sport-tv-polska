
name: Aktualizacja Sport TV Polska

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Zainstaluj Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aktualizuj terminarz
        run: python update_epg.py https://epgshare01.online/epgshare01/epg_ripper_PL1.xml.gz

      - name: Zapisz zmiany
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json
          if ! git diff --cached --quiet; then
            git commit -m "Automatyczna aktualizacja terminarza"
            git push
          fi
