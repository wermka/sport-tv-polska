
name: Aktualizacja Sport TV Polska

on:
  schedule:
    # 08:17, 14:17, 20:17 w Polsce, z uwzglednieniem czasu letniego/zimowego.
    # GitHub cron dziala w UTC; filtr w pierwszym kroku odrzuca nieaktywna strefe.
    - cron: "17 6,12,18 * * *"  # CEST / UTC+2
    - cron: "17 7,13,19 * * *"  # CET / UTC+1
  push:
    paths:
      - ".github/workflows/update.yml"
      - "verify_polish_entries.py"
      - "verify_ski_broadcasts.py"
      - "discover_ski.py"
      - "test_discover_ski.py"
      - "update_epg.py"
      - "test_update_epg.py"
      - "sport_competitions.json"
      - "tv_schedule.py"
      - "verify_tennis_broadcasts.py"
      - "update_tennis.py"
      - "test_update_tennis.py"
      - "index.html"
      - "verify_athletics_broadcasts.py"
      - "test_verify_ski_broadcasts.py"
      - "test_verify_tennis_broadcasts.py"
      - "test_verify_athletics_broadcasts.py"
      - "test_tv_schedule.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sport-tv-polska-dane
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Dopasuj harmonogram do czasu polskiego
        id: local_time
        env:
          TRIGGER: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          if [[ "$TRIGGER" != "schedule" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            offset="$(TZ=Europe/Warsaw date +%z)"
            if [[ "$offset" == "+0200" && "$SCHEDULE" == "17 6,12,18 * * *" ]] ||
               [[ "$offset" == "+0100" && "$SCHEDULE" == "17 7,13,19 * * *" ]]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Pomijam harmonogram spoza aktywnej strefy czasowej ($offset)."
            fi
          fi

      - name: Pobierz repozytorium
        if: steps.local_time.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Zainstaluj Python
        if: steps.local_time.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
         
      - name: Kontrola skladni wszystkich skryptow
        if: steps.local_time.outputs.run == 'true'
        run: python -m compileall -q update_epg.py update_tennis.py match_tennis_tv.py teleman_importer.py verify_tennis_broadcasts.py verify_ski_broadcasts.py verify_polish_entries.py verify_athletics_broadcasts.py check_tennis_updates.py tv_schedule.py discover_ski.py

      - name: Testy poprawnosci weryfikacji
        if: steps.local_time.outputs.run == 'true'
        run: python -m unittest -v test_verify_tennis_broadcasts.py test_check_tennis_updates.py test_verify_ski_broadcasts.py test_update_epg.py test_verify_polish_entries.py test_verify_athletics_broadcasts.py test_tv_schedule.py test_discover_ski.py test_update_tennis.py

      - name: Oblicz terminarz i bezpiecznie zapisz wyniki
        if: steps.local_time.outputs.run == 'true'
        env:
          LIVE_TENNIS_API_KEY: ${{ secrets.LIVE_TENNIS_API_KEY }}
          PAGES: ${{ github.event_name == 'workflow_dispatch' && '8' || '6' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="${GITHUB_REF_NAME:-main}"

          # Kazda proba zaczyna od najnowszych danych, a NIE od
          # obliczen wykonanych przed konkurencyjnym commitem.
          for attempt in 1 2 3; do
            echo "Aktualizacja na najnowszym stanie repozytorium: proba $attempt"
            git fetch origin "$branch"
            git reset --hard "origin/$branch"

            python -m compileall -q update_epg.py update_tennis.py match_tennis_tv.py teleman_importer.py verify_tennis_broadcasts.py verify_ski_broadcasts.py verify_polish_entries.py verify_athletics_broadcasts.py check_tennis_updates.py tv_schedule.py discover_ski.py
            python -m unittest -q test_verify_tennis_broadcasts.py test_check_tennis_updates.py test_verify_ski_broadcasts.py test_update_epg.py test_verify_polish_entries.py test_verify_athletics_broadcasts.py test_tv_schedule.py test_discover_ski.py test_update_tennis.py

            python update_tennis.py
            python update_epg.py https://epgshare01.online/epgshare01/epg_ripper_PL1.xml.gz
            python match_tennis_tv.py
            python teleman_importer.py --pages "$PAGES"
            python verify_tennis_broadcasts.py
            python verify_polish_entries.py
            python discover_ski.py
            python verify_ski_broadcasts.py
            python verify_athletics_broadcasts.py

            git add events.json candidates.json tennis_candidates.json tennis_tv_matches.json teleman_review.json participation_verified.json
            if git diff --cached --quiet; then
              echo "Brak zmian do zapisania."
              exit 0
            fi
            git commit -m "Automatyczna aktualizacja terminarza"
            if git push origin "HEAD:$branch"; then
              echo "Dane zapisane bez konfliktu."
              exit 0
            fi

            # Push rejected: rebase nie wystarcza, bo pliki JSON sa
            # generowane. Musimy przeliczyc je od poczatku.
            echo "Repozytorium zmienilo sie w trakcie obliczen. Przeliczam na aktualnych danych."
            sleep $((attempt * 3))
          done
          echo "::error::Repozytorium zmienialo sie podczas kazdej z trzech prob."
          exit 1
