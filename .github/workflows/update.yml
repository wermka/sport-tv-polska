
name: Aktualizacja Sport TV Polska

on:
  schedule:
    # 06:00, 12:00 i 18:00 UTC (w Polsce 08/14/20 latem, 07/13/19 zimą)
    - cron: "0 6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sport-tv-polska-dane
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Zainstaluj Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
         
      - name: Testy poprawnosci weryfikacji
        run: python -m unittest -v test_verify_tennis_broadcasts.py test_check_tennis_updates.py test_verify_ski_broadcasts.py

      - name: Pobierz mecze polskich tenisistow
        env:
          LIVE_TENNIS_API_KEY: ${{ secrets.LIVE_TENNIS_API_KEY }}
        run: python update_tennis.py

      - name: Aktualizuj terminarz
        run: python update_epg.py https://epgshare01.online/epgshare01/epg_ripper_PL1.xml.gz
      
      - name: Dopasuj mecze tenisowe do TV
        run: python match_tennis_tv.py
     
      - name: Sprawdz transmisje Polakow w Teleman
        run: python teleman_importer.py --pages ${{ github.event_name == 'workflow_dispatch' && '8' || '6' }}

      - name: Zweryfikuj tenis w trzech zrodlach
        run: python verify_tennis_broadcasts.py

      - name: Zweryfikuj skoki z udzialem Polakow
        run: python verify_ski_broadcasts.py

      - name: Zapisz zmiany
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json candidates.json tennis_candidates.json tennis_tv_matches.json teleman_review.json
          if ! git diff --cached --quiet; then
            git commit -m "Automatyczna aktualizacja terminarza"
            git push
          fi
