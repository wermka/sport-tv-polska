<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Sport TV Polska</title><style>

:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#f4f7ff;background:#0d1726}
*{box-sizing:border-box}
body{margin:0}
.wrap{max-width:1050px;margin:auto;padding:22px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px}
h1{font-size:clamp(30px,5vw,48px);margin:4px 0}
small,.muted{color:#a9bfd8}
.clock{font-size:clamp(26px,5vw,48px);font-weight:800;font-variant-numeric:tabular-nums}
.status{display:inline-block;background:#23364e;color:#d9e9fc;border-radius:12px;padding:8px 12px;font-weight:650;margin-top:15px}
.tabs,.controls{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}
.tabs button,.controls button{background:#23364e;border:2px solid transparent;border-radius:13px;color:white;padding:13px 19px;font-size:19px;font-weight:750;cursor:pointer}
.tabs button.active,.controls button.active{background:#c9e6ff;color:#0d2841}
.card{background:#1c2d43;border:1px solid #35506e;border-radius:20px;padding:18px;margin:16px 0;overflow:hidden}
.card-date{display:flex;align-items:center;gap:12px;background:#493823;border-radius:14px;padding:14px 17px;font-size:clamp(20px,3vw,25px);font-weight:850;color:#FFB454}
.calendar-icon{font-size:25px;flex:0 0 auto}
.event-main{display:flex;align-items:center;gap:22px;padding:20px 2px 18px}
.time-box{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;flex:0 0 158px;min-height:108px;padding:16px 12px;background:#10243c;border:1px solid #466080;border-radius:15px}
.time-label{font-size:12px;color:#b8cbe1;font-weight:800;letter-spacing:.08em}
.time{font-size:clamp(30px,4.4vw,41px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
.details{flex:1;min-width:0}
.kind{color:#a8d3ff;font-size:15px;font-weight:850;letter-spacing:.04em}
.name{font-size:clamp(23px,3.3vw,30px);font-weight:850;line-height:1.25;margin:8px 0}
.tournament{color:#c8def9;font-size:19px;font-weight:650;margin-top:8px}
.card-bottom{border-top:1px solid #48617e;padding:16px 4px 2px}
.channel{display:flex;align-items:center;gap:14px;color:#ecf5ff;font-size:20px;font-weight:750;line-height:1.3}
.tv-icon{font-size:27px;flex:0 0 auto}
.channel-label{display:block;color:#9fb8d5;font-size:12px;letter-spacing:.07em;font-weight:850;margin-bottom:3px}
.channel-main{font-size:clamp(19px,2.6vw,24px);font-weight:850}
.tv-start{font-size:17px;color:#bad3ee;font-weight:650;margin-top:4px}
.no-channel{color:#c7d5e7;font-size:18px;font-weight:650}
.badges{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:10px}
.badges:empty{display:none}
.pill{display:inline-block;background:#20563f;color:#aff9d0;border-radius:9px;padding:6px 10px;font-size:14px;font-weight:800}
.warning{background:#55431b;color:#fff0b8}
.alert{background:#1c6047;border:2px solid #77d6a9;border-radius:18px;padding:18px;margin-top:18px}
.alert h2{margin:0 0 7px;font-size:28px}
.empty{background:#1c2d43;border-radius:18px;padding:30px;font-size:22px;color:#c6d6e9}
.foot{font-size:15px;color:#b7c7d9;margin:24px 0;line-height:1.6}
button:focus-visible{outline:3px solid #fff}
@media(max-width:600px){
 .wrap{padding:13px}
 header{align-items:flex-start}
 .tabs button{flex:1}
 .controls button{font-size:17px;padding:12px 13px}
 .card{padding:12px}
 .card-date{padding:12px;font-size:19px;gap:9px}
 .calendar-icon{font-size:22px}
 .event-main{gap:12px;padding:16px 2px}
 .time-box{flex-basis:102px;min-height:95px;padding:12px 5px}
 .time{font-size:28px}
 .time-label{font-size:10px}
 .name{font-size:21px}
 .kind{font-size:13px}
 .tournament{font-size:16px}
 .channel{gap:10px}
 .channel-main{font-size:20px}
 .tv-start,.no-channel{font-size:16px}
}
@media(max-width:380px){
 .event-main{align-items:flex-start}
 .time-box{flex-basis:93px}
 .name{font-size:19px}
}
</style></head><body><main class="wrap"><header><div><small>🇵🇱 SPORT TV POLSKA · WSZYSTKIE KANAŁY</small><h1>Program sportowy</h1><div id="date" class="muted"></div></div><div class="clock" id="clock">--:--</div></header><div class="status">Transmisje TV oraz zaplanowane mecze polskich tenisistów</div><section id="alert" aria-live="polite"></section><nav class="tabs" aria-label="Wybór dnia"><button class="active" data-day="0">Dzisiaj</button><button data-day="1">Jutro</button><button data-day="7">7 dni</button></nav><div class="controls" aria-label="Filtr dyscypliny"><button class="active" data-sport="all">Wszystkie</button><button data-sport="tenis">🎾 Tenis</button><button data-sport="siatkowka">🏐 Siatkówka</button><button data-sport="pilka">⚽ Piłka</button><button data-sport="skoki">🎿 Skoki</button><button data-sport="lekkoatletyka">🏃 Lekkoatletyka</button></div><section id="events"></section><div class="foot">Godziny meczów tenisowych mogą się zmienić. Gdy godzina transmisji TV różni się od początku meczu, pokazujemy ją osobno. Przypomnienia działają tylko przy otwartej stronie.</div></main><script>
const sports={tenis:['🎾','TENIS'],siatkowka:['🏐','SIATKÓWKA'],pilka:['⚽','PIŁKA NOŻNA'],skoki:['🎿','SKOKI NARCIARSKIE'],lekkoatletyka:['🏃','LEKKOATLETYKA']};
let examples=[], updates=[], day=0,sport='all';const pad=n=>String(n).padStart(2,'0');
function label(d){return d.toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long'})}
function prominentDate(d){const value=label(d);return value.charAt(0).toLocaleUpperCase('pl-PL')+value.slice(1)}
function countdown(diff){const m=Math.max(1,Math.ceil(diff));return `ZA ${m} ${m===1?"MINUTĘ":m%10>=2&&m%10<=4&&(m<12||m>14)?"MINUTY":"MINUT"}`}
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const now=new Date();document.getElementById('clock').textContent=`${pad(now.getHours())}:${pad(now.getMinutes())}`;document.getElementById('date').textContent=label(now);
const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
const chosen=examples.filter(e=>{let start=new Date(e.start),d=Math.round((new Date(start.getFullYear(),start.getMonth(),start.getDate())-today)/86400000);return (e.end||e.displayUntil?new Date(e.end||e.displayUntil)>now:false)&&(day===7?(d>=0&&d<7):d===day)&&(sport==='all'||e.sport===sport)}).sort((a,b)=>new Date(a.start)-new Date(b.start));
document.getElementById('events').innerHTML=chosen.length?chosen.map(e=>{
  const start=new Date(e.start),diff=(start-now)/60000;
  const live=e.verifiedLive===true&&e.tvStart&&now>=new Date(e.tvStart)&&e.end&&now<new Date(e.end);
  const soon=diff>0&&diff<=15;
  const change=updates.find(u=>String(u.matchId)===String(e.matchId)&&u.tvStart===e.start);
  const tvTime=e.sport==="tenis"&&e.tvStart&&new Date(e.tvStart).getTime()!==start.getTime()
    ?`<div class="tv-start">Emisja TV: ${esc(new Date(e.tvStart).toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'}))}</div>`:"";
  const channelBlock=e.channel
    ?`<span class="tv-icon" aria-hidden="true">📺</span><div><span class="channel-label">KANAŁ TV</span><div class="channel-main">${esc(e.channel)}</div>${tvTime}</div>`
    :`<span class="tv-icon" aria-hidden="true">📺</span><div><span class="channel-label">KANAŁ TV</span><div class="no-channel">Niepotwierdzony</div></div>`;
  return `<article class="card">
    <div class="card-date"><span class="calendar-icon" aria-hidden="true">📅</span><span>${esc(prominentDate(start))}</span></div>
    <div class="event-main">
      <div class="time-box"><span class="time-label">POCZĄTEK</span><time class="time" datetime="${esc(e.start)}">${pad(start.getHours())}:${pad(start.getMinutes())}</time></div>
      <div class="details">
        <div class="kind">${sports[e.sport][0]} ${sports[e.sport][1]}</div>
        <div class="name">${esc(e.name)}</div>
        ${e.sport==="tenis"&&typeof e.tournament==="string"&&e.tournament.trim()?`<div class="tournament">🏆 ${esc(e.tournament)}</div>`:""}
      </div>
    </div>
    <div class="card-bottom">
      <div class="channel">${channelBlock}</div>
      <div class="badges">
        ${e.statusUnconfirmedAfterStart?'<span class="pill warning">Status meczu niepotwierdzony · możliwe, że trwa</span>':''}
        ${e.participationEvidence==="official_roster_announced"?'<span class="pill">🇵🇱 Ogłoszona kadra Polski</span>':e.participationEvidence==="official_start_list"?'<span class="pill">🇵🇱 Polacy na liście startowej</span>':''}
        ${change?`<span class="pill warning">🎾 Nowa planowana godzina meczu: ${esc(new Date(change.scheduledStart).toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'}))}${e.channel?' · emisja TV bez zmian':' · brak potwierdzonego kanału'}</span>`:''}
        ${live?'<span class="pill">W PROGRAMIE TERAZ · sprawdź transmisję</span>':soon?`<span class="pill warning">${countdown(diff)}</span>`:''}
      </div>
    </div>
  </article>`;
}).join(''):'<div class="empty">Brak zaplanowanych meczów lub potwierdzonych transmisji w tym widoku.</div>';
const alert=chosen.find(e=>{const diff=(new Date(e.start)-now)/60000;return diff>0&&diff<=15});document.getElementById('alert').innerHTML=alert?`<div class="alert"><h2>🔔 ${countdown((new Date(alert.start)-now)/60000)}</h2><div class="name">${esc(alert.name)}</div><div class="channel">${alert.channel?`${alert.sport==="tenis"?"Mecz wkrótce · kanał: ":"Włącz: "}${esc(alert.channel)}`:"Nadchodzi mecz · kanał TV niepotwierdzony"}</div></div>`:''}
async function refresh(){try{const r=await fetch('events.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Brak danych');const d=await r.json();examples=(d.events||[]).filter(e=>e.verifiedLive===true||(e.sport==="tenis"&&e.matchScheduled===true&&e.matchId));updates=[];try{const tr=await fetch('tennis_updates.json?t='+Date.now(),{cache:'no-store'});if(tr.ok){const td=await tr.json();if(td.checkedAt&&Date.now()-new Date(td.checkedAt).getTime()<45*60000&&Date.now()>=new Date(td.checkedAt).getTime())updates=td.updates||[]}}catch(_){}document.querySelector('.status').textContent='Transmisje i mecze Polaków · Aktualizacja: '+new Date(d.updatedAt).toLocaleString('pl-PL');}catch(e){document.querySelector('.status').textContent='BRAK AKTUALNYCH DANYCH TERMINARZA'}render()}
document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{day=Number(b.dataset.day);document.querySelectorAll('[data-day]').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelectorAll('[data-sport]').forEach(b=>b.onclick=()=>{sport=b.dataset.sport;document.querySelectorAll('[data-sport]').forEach(x=>x.classList.toggle('active',x===b));render()});refresh();setInterval(render,15000);setInterval(refresh,15*60*1000);
</script></body></html>
